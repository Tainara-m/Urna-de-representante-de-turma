<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urna Escolar | E.E. Vicente de Paula Fraga</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="manifest" href="site.webmanifest">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--v:#B03A2E;--vd:#7B241C;--vc:#FAEDEB;--c:#2C2C2A;--cm:#5F5E5A;--cc:#F1EFE8;--b:rgba(0,0,0,.14)}
body{font-family:'Source Serif 4',Georgia,serif;font-size:16px;color:var(--c);background:linear-gradient(180deg,#fff,var(--cc));min-height:100vh}
button,input,select,textarea{font:inherit}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif}
.hd{background:linear-gradient(135deg,var(--vd),var(--v));color:#fff;padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem;position:sticky;top:0;z-index:5}
.hd .l{display:flex;align-items:center;gap:.7rem;min-width:0}
.hd img{width:48px;height:48px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}
.hd h1{font-size:clamp(.95rem,3vw,1.3rem);line-height:1.15}
.hd small{opacity:.9;font-size:.78rem}
main{max-width:980px;margin:0 auto;padding:clamp(.8rem,3vw,1.5rem)}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:clamp(.9rem,3vw,1.5rem);box-shadow:0 12px 36px rgba(0,0,0,.07);margin-bottom:1rem}
.btn{min-height:42px;padding:.55rem 1.1rem;border-radius:9px;border:1.5px solid transparent;cursor:pointer;font-weight:700;background:var(--vd);color:#fff}
.btn:hover{background:#5f1511}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.s{background:#fff;color:var(--c);border-color:var(--b)}.btn.s:hover{border-color:var(--v)}
.btn.d{background:#fff;color:var(--vd);border-color:var(--v)}
:focus-visible{outline:3px solid rgba(176,58,46,.45);outline-offset:2px}
input,select,textarea{width:100%;min-height:42px;padding:.5rem .75rem;border:1.5px solid var(--b);border-radius:9px;background:#fff}
label{display:block;font-size:.85rem;font-weight:700;color:var(--cm);margin:.7rem 0 .25rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 150px}
.msg{color:var(--vd);font-size:.9rem;margin-top:.5rem;min-height:1.2em}
.tabs{display:flex;gap:.4rem;overflow-x:auto;margin-bottom:1rem}
.tabs .btn{white-space:nowrap;border-radius:999px;min-height:38px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl td,.tbl th{padding:.45rem .5rem;border-bottom:1px solid var(--cc);text-align:left}
.wrap{overflow-x:auto}
.thumb{width:44px;height:54px;object-fit:cover;border-radius:6px;background:var(--cc)}
.tag{font-size:.72rem;padding:.1rem .5rem;border-radius:99px;background:var(--vc);color:var(--vd);font-weight:700;margin-left:.3rem}
.tag.v{background:#EBF5FB;color:#1A5276}.tag.e{background:#FEF3C7;color:#92400E}
.bar{height:.5rem;background:var(--cc);border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--v)}
.rc{display:grid;grid-template-columns:44px 1fr minmax(120px,1.2fr);gap:.7rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--cc)}
.rh{background:var(--vd);color:#fff;padding:.6rem .9rem;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.rb{border:1px solid var(--b);border-radius:10px;margin-bottom:1rem;overflow:hidden}.rb>div:not(.rh){padding:0 .9rem}
.hero{text-align:center;max-width:460px;margin:2vh auto}
.hero h2{color:var(--vd);font-size:1.6rem;margin-bottom:.4rem}
.hero input{text-align:center;font-size:1.3rem;letter-spacing:.15em;margin:1rem 0 .5rem}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:1rem;z-index:20}.mdl[hidden]{display:none}
.mdl .card{max-width:420px;width:100%;margin:0}
.dl{margin:.8rem 0}.dl b{display:block;font-size:.75rem;color:var(--cm);text-transform:uppercase;letter-spacing:.08em}.dl span{font-family:'Playfair Display',serif;font-size:1.25rem}
/* urna */
.urna{display:grid;grid-template-columns:1.6fr 1fr;gap:1rem;background:#3a3a38;padding:1rem;border-radius:16px}
.tela{background:#e6ebdc;border:4px solid #222;border-radius:8px;padding:1rem;min-height:340px;display:flex;flex-direction:column;gap:.6rem;color:#111}
.tela small{font-size:.8rem}.tela h3{font-size:1.1rem}
.dig{display:flex;gap:.4rem}.dig i{width:46px;height:56px;border:2px solid #111;display:grid;place-items:center;font:700 2rem/1 monospace;font-style:normal;background:#f4f7ee}
.cand{display:flex;gap:.8rem;align-items:center}.cand img,.cand .ph{width:90px;height:110px;object-fit:cover;border:2px solid #111;background:#ccd}
.big{font:700 1.8rem 'Playfair Display',serif;text-align:center;margin:auto}
.rod{margin-top:auto;border-top:1px solid #111;padding-top:.4rem;font-size:.78rem}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;align-content:start}
.pad button{min-height:52px;border-radius:7px;border:0;background:#1d1d1c;color:#fff;font:700 1.4rem monospace;cursor:pointer;box-shadow:0 3px 0 #000}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad .w{background:#fff;color:#111;font-size:.72rem;grid-column:1/-1}.pad .o{background:#e8802a;font-size:.72rem}.pad .g{background:#2e9e4f;font-size:.72rem;grid-column:span 2}
.pad .z{grid-column:2}
@media(max-width:640px){.urna{grid-template-columns:1fr}.tela{min-height:300px}.rc{grid-template-columns:44px 1fr}.rc .bw{grid-column:1/-1}}
#rel{display:none}
@media print{body>*:not(#rel){display:none!important}#rel{display:block;color:#000;font-size:11pt}#rel .rb{break-inside:avoid;border-color:#999}#rel .rh{background:#eee;color:#000;border:1px solid #999}@page{size:A4;margin:14mm}.sig{display:flex;gap:3rem;margin-top:3rem}.sig div{flex:1;border-top:1px solid #000;text-align:center;padding-top:.3rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hd">
  <div class="l"><img src="logo.png" alt="Logo da escola"><div><h1>Escola Estadual Vicente de Paula Fraga</h1><small>Eleição de representantes de turma · 2026</small></div></div>
  <button class="btn s" id="hb" onclick="location.hash='#/admin'">Coordenação</button>
</header>
<main id="v"></main>
<div class="mdl" id="modal" hidden></div>
<div id="rel"></div>
<script>
const TURMAS=[['6efti','6º ano EFTI'],['7efti','7º ano EFTI'],['8efti','8º ano EFTI'],['9efti','9º ano EFTI'],['1emti','1º ano EMTI'],['2emti','2º ano EMTI'],['3emti','3º ano EMTI']];
const NT=Object.fromEntries(TURMAS);
const SEED={'6efti':'Juliano,Pérola,Gustavo,Isadora,Yasmin,Erique,Pablo','7efti':'Alex,Davi,Lucas,Júlia,Ana Júlia,Tales,David','8efti':'Theo,Thayane,Maria Eduarda,Riquelme,Maria Cecília,Wagner','9efti':'Ana Laura,Thaila,Adriany','1emti':'Carlos Alves,Cauan,Edson,Maria Fernanda Alves,Maria Fernanda Silva','2emti':'Any Cristhiny,Emylly Yasmin,Ezequiel,Josué,Luiz Henrique,Rita','3emti':'Kailaine,Marcela Bessa,Mylla,Andrei,Cassiano'};
const K='urna-vpf-2026-v2';
let D=JSON.parse(localStorage.getItem(K)||'null')||{meta:{status:'preparacao'},cands:{},eleitores:{},votos:{}};
const save=()=>localStorage.setItem(K,JSON.stringify(D));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mat=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const opts=(sel)=>TURMAS.map(([i,n])=>`<option value="${i}" ${sel===i?'selected':''}>${n}</option>`).join('');
const H=async s=>crypto.subtle?[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join(''):btoa(s);
let U=null,idle=null,tab='painel',FOTO=null,fT='6efti',eT='';
const V=h=>{$('#v').innerHTML=h};
const modal=h=>{const m=$('#modal');m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${h}</div>`;m.hidden=false};
const fechar=()=>{$('#modal').hidden=true};

function render(){
  U=null;clearTimeout(idle);fechar();
  const h=location.hash;
  $('#hb').style.display=h==='#/admin'?'none':'';
  if(h==='#/acompanhar')return pub();
  if(h==='#/admin')return admin();
  home();
}
addEventListener('hashchange',render);
addEventListener('storage',e=>{if(e.key===K){D=JSON.parse(e.newValue);if(location.hash==='#/acompanhar')pub();}});
addEventListener('keydown',e=>{
  if(!U||!$('#modal').hidden)return;
  if(/^\d$/.test(e.key))tecla(e.key);else if(e.key==='Backspace')corrige();else if(e.key==='Enter'){e.preventDefault();confirma();}
});

/* ---------- votação ---------- */
function home(){
  const ab=D.meta.status==='aberta';
  V(`<div class="card hero"><h2>${ab?'Informe sua matrícula':'Votação indisponível'}</h2>
  <p>${ab?'Você confirmará seus dados antes de votar. Seu voto é secreto.':D.meta.status==='encerrada'?'A votação foi encerrada.':'A votação ainda não foi aberta pela coordenação.'}</p>
  ${ab?`<input id="mt" placeholder="Nº da matrícula" autocomplete="off" onkeydown="if(event.key==='Enter')buscar()"><button class="btn" style="width:100%" onclick="buscar()">Continuar</button><div class="msg" id="er" role="alert"></div>`:''}
  </div>`);
  if(ab)$('#mt').focus();
}
function buscar(){
  const m=mat($('#mt').value),e=D.eleitores[m];
  if(!m)return;
  if(!e)return $('#er').textContent='Matrícula não encontrada. Procure a coordenação.';
  if(e.votou)return $('#er').textContent='Esta matrícula já votou.';
  modal(`<h2>Confirme seus dados</h2><div class="dl"><b>Nome</b><span>${esc(e.nome)}</span></div><div class="dl"><b>Turma</b><span>${NT[e.turma]}</span></div><div class="dl"><b>Matrícula</b><span>${esc(m)}</span></div>
  <div class="row"><button class="btn s" onclick="fechar()">Não sou eu</button><button class="btn" onclick="iniciar('${m}')">Sim, sou eu</button></div>`);
}
function iniciar(m){fechar();U={m,t:D.eleitores[m].turma,cod:'',b:false};urnaR();}
function ping(){clearTimeout(idle);idle=setTimeout(()=>{U=null;home();},90000);}
function urnaR(){
  ping();
  const c=U.cod.length===3?D.cands[U.t]?.[U.cod]:null;
  let info='';
  if(U.b)info='<div class="big">VOTO EM BRANCO</div>';
  else if(U.cod.length===3)info=c?`<div class="cand">${c.foto?`<img src="${c.foto}" alt="">`:'<div class="ph"></div>'}<div><small>Nome</small><h3>${esc(c.nome)}</h3><small>Representante de turma</small></div></div>`:'<div class="big">NÚMERO ERRADO<br><small>VOTO NULO</small></div>';
  const d=[0,1,2].map(i=>`<i>${U.cod[i]||''}</i>`).join('');
  const pad=[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="tecla('${n}')" aria-label="${n}">${n}</button>`).join('');
  V(`<div class="urna"><div class="tela" aria-live="polite"><small>SEU VOTO PARA</small><h3>Representante · ${NT[U.t]}</h3>
  ${U.b?'':`<small>Número</small><div class="dig">${d}</div>`}${info}
  <div class="rod">Aperte a tecla:<br>VERDE para CONFIRMAR este voto · LARANJA para CORRIGIR</div></div>
  <div class="pad">${pad}<button class="z" onclick="tecla('0')">0</button>
  <button class="w" onclick="branco()">BRANCO</button><button class="o" onclick="corrige()">CORRIGE</button><button class="g" onclick="confirma()">CONFIRMA</button></div></div>`);
}
function tecla(d){if(!U||U.b||U.cod.length>=3)return;U.cod+=d;urnaR();}
function branco(){if(!U)return;U.b=true;U.cod='';urnaR();}
function corrige(){if(!U)return;U.b=false;U.cod='';urnaR();}
function confirma(){
  if(!U)return;
  const k=U.b?'branco':U.cod.length===3?(D.cands[U.t]?.[U.cod]?'c'+U.cod:'nulo'):null;
  if(!k)return;
  (D.votos[U.t]??={})[k]=(D.votos[U.t][k]||0)+1;
  D.eleitores[U.m].votou=true;   // sem horário: o voto não se liga ao eleitor
  save();U=null;clearTimeout(idle);
  V(`<div class="urna" style="grid-template-columns:1fr"><div class="tela" style="min-height:300px;justify-content:center"><div class="big" style="font-size:4rem">FIM</div><p style="text-align:center">Voto registrado. Obrigado por participar!</p></div></div>`);
  setTimeout(()=>{if(!U)home();},4000);
}

/* ---------- resultados ---------- */
function calc(t){
  const v=D.votos[t]||{},cs=Object.entries(D.cands[t]||{}).map(([c,o])=>({c,...o,n:v['c'+c]||0})).sort((a,b)=>b.n-a.n||a.nome.localeCompare(b.nome));
  const el=Object.values(D.eleitores).filter(e=>e.turma===t);
  return{cs,br:v.branco||0,nu:v.nulo||0,apt:el.length,vot:el.filter(e=>e.votou).length};
}
function resHTML(){
  return TURMAS.map(([t,nome])=>{
    const r=calc(t),tot=r.cs.reduce((a,c)=>a+c.n,0)+r.br+r.nu;
    const emp=i=>tot&&r.cs[i].n>0&&(r.cs[i+1]?.n===r.cs[i].n||r.cs[i-1]?.n===r.cs[i].n);
    const lin=r.cs.map((c,i)=>{
      const p=tot?Math.round(c.n/tot*100):0;
      const tg=(i===0&&c.n?'<span class="tag">Representante</span>':i===1&&c.n?'<span class="tag v">Vice</span>':'')+(i<2&&emp(i)?'<span class="tag e">Empate</span>':'');
      return `<div class="rc"><div>${c.foto?`<img class="thumb" src="${c.foto}" alt="">`:`<b>${i+1}º</b>`}</div><div><b>${esc(c.nome)}</b> <small>(${c.c})</small>${tg}</div><div class="bw" style="display:flex;gap:.5rem;align-items:center"><div class="bar"><i style="width:${p}%"></i></div><small>${c.n} (${p}%)</small></div></div>`;
    }).join('')||'<p style="padding:.6rem 0">Sem candidatos cadastrados.</p>';
    return `<div class="rb"><div class="rh"><b>${nome}</b><span>${tot} voto${tot!==1?'s':''} · ${r.vot}/${r.apt} eleitores votaram</span></div><div>${lin}<p style="padding:.6rem 0"><small>Brancos: <b>${r.br}</b> · Nulos: <b>${r.nu}</b> · Abstenções: <b>${r.apt-r.vot}</b></small></p></div></div>`;
  }).join('');
}
function pub(){
  const ok=D.meta.status==='encerrada'||D.meta.publico;
  V(`<div class="card"><h2>Acompanhamento da apuração</h2><p style="color:var(--cm);margin:.3rem 0 1rem">Atualiza sozinho quando um voto é registrado.</p>${ok?resHTML():'<p>Os resultados serão exibidos quando a coordenação liberar ou ao encerrar a votação.</p>'}</div>`);
}

/* ---------- coordenação ---------- */
async function admin(){
  if(!D.meta.h)return V(`<div class="card hero"><h2>Crie a senha da coordenação</h2><p>Primeiro acesso. Mínimo de 6 caracteres.</p><input id="pw" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')criar()"><button class="btn" style="width:100%" onclick="criar()">Salvar senha</button><div class="msg" id="er"></div></div>`);
  if(sessionStorage.getItem('adm')!==D.meta.h)return V(`<div class="card hero"><h2>Área da coordenação</h2><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()"><button class="btn" style="width:100%" onclick="entrar()">Entrar</button><div class="msg" id="er" role="alert"></div><button class="btn s" onclick="location.hash='#/'">Voltar</button></div>`);
  const T=[['painel','Painel'],['cand','Candidatos'],['eleit','Eleitores'],['res','Resultados']];
  V(`<div class="tabs">${T.map(([i,n])=>`<button class="btn ${tab===i?'':'s'}" onclick="tab='${i}';admin()">${n}</button>`).join('')}<button class="btn s" onclick="sair()">Sair</button></div><div id="ab"></div>`);
  $('#ab').innerHTML={painel:pPainel,cand:pCand,eleit:pEleit,res:pRes}[tab]();
}
async function criar(){const p=$('#pw').value;if(p.length<6)return $('#er').textContent='Use ao menos 6 caracteres.';D.meta.h=await H(p);save();sessionStorage.setItem('adm',D.meta.h);admin();}
async function entrar(){if(await H($('#pw').value)===D.meta.h){sessionStorage.setItem('adm',D.meta.h);admin();}else{$('#er').textContent='Senha incorreta.';}}
function sair(){sessionStorage.removeItem('adm');location.hash='#/';}
function pPainel(){
  const s=D.meta.status,link=location.href.split('#')[0]+'#/acompanhar';
  const nE=Object.keys(D.eleitores).length,nV=Object.values(D.eleitores).filter(e=>e.votou).length;
  return `<div class="card"><h2>Situação da votação</h2><p style="margin:.4rem 0">${nE} eleitores cadastrados · ${nV} já votaram.</p>
  <div class="row">${[['preparacao','Em preparação'],['aberta','Abrir votação'],['encerrada','Encerrar votação']].map(([i,n])=>`<button class="btn ${s===i?'':'s'}" onclick="setStatus('${i}')">${n}</button>`).join('')}</div></div>
  <div class="card"><h2>Link de acompanhamento</h2><div class="row"><input readonly value="${esc(link)}" onclick="this.select()"><button class="btn" style="flex:0 0 auto" onclick="navigator.clipboard.writeText('${esc(link)}')">Copiar</button></div>
  <label style="display:flex;gap:.5rem;align-items:center;font-weight:400"><input type="checkbox" style="width:auto;min-height:0" ${D.meta.publico?'checked':''} onchange="D.meta.publico=this.checked;save()"> Mostrar resultado parcial no link durante a votação</label>
  <p class="msg" style="color:var(--cm)">Nesta versão o link atualiza em tempo real nas abas abertas no mesmo computador.</p></div>`;
}
function setStatus(s){D.meta.status=s;save();admin();}
function pCand(){
  const l=Object.entries(D.cands[fT]||{}).sort();
  const vazio=!Object.keys(D.cands).length;
  return `<div class="card"><h2>Candidatos</h2><div class="row"><div><label>Turma</label><select onchange="fT=this.value;FOTO=null;admin()">${opts(fT)}</select></div></div>
  <div class="row"><div><label>Código (3 algarismos)</label><input id="cc" maxlength="3" inputmode="numeric" placeholder="123"></div><div style="flex:2 1 220px"><label>Nome</label><input id="cn"></div><div><label>Foto</label><input type="file" accept="image/*" onchange="pickFoto(this)"></div></div>
  <button class="btn" style="margin-top:.8rem" onclick="addCand()">Cadastrar candidato</button><div class="msg" id="er" role="alert"></div>
  ${vazio?`<button class="btn s" onclick="seed()">Importar candidatos da versão anterior</button>`:''}
  <div class="wrap"><table class="tbl"><tr><th>Foto</th><th>Código</th><th>Nome</th><th></th></tr>${l.map(([c,o])=>`<tr><td>${o.foto?`<img class="thumb" src="${o.foto}" alt="">`:''}</td><td>${c}</td><td>${esc(o.nome)}</td><td><button class="btn d" onclick="delCand('${c}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="4">Nenhum candidato nesta turma.</td></tr>'}</table></div></div>`;
}
function pickFoto(inp){
  const f=inp.files[0];if(!f)return;const i=new Image();
  i.onload=()=>{const c=document.createElement('canvas');c.width=180;c.height=220;const x=c.getContext('2d'),s=Math.max(180/i.width,220/i.height),w=i.width*s,h=i.height*s;x.drawImage(i,(180-w)/2,(220-h)/2,w,h);FOTO=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(i.src);};
  i.src=URL.createObjectURL(f);
}
function addCand(){
  const c=$('#cc').value.trim(),n=$('#cn').value.trim(),er=$('#er');
  if(!/^\d{3}$/.test(c))return er.textContent='O código deve ter exatamente 3 algarismos.';
  if(!n)return er.textContent='Informe o nome do candidato.';
  if(D.cands[fT]?.[c])return er.textContent='Já existe um candidato com esse código nesta turma.';
  (D.cands[fT]??={})[c]={nome:n,foto:FOTO};FOTO=null;save();admin();
}
function delCand(c){
  if(Object.keys(D.votos[fT]||{}).length)return alert('Esta turma já tem votos. Zere os votos antes de remover candidatos.');
  if(confirm('Remover este candidato?')){delete D.cands[fT][c];save();admin();}
}
function seed(){
  TURMAS.forEach(([t])=>{const p={'6efti':6,'7efti':7,'8efti':8,'9efti':9,'1emti':1,'2emti':2,'3emti':3}[t];D.cands[t]={};SEED[t].split(',').forEach((n,i)=>D.cands[t][`${p}${String(i+1).padStart(2,'0')}`]={nome:n,foto:null});});
  save();admin();
}
function pEleit(){
  const l=Object.entries(D.eleitores).filter(([,e])=>!eT||e.turma===eT).sort((a,b)=>a[1].nome.localeCompare(b[1].nome));
  return `<div class="card"><h2>Eleitores</h2>
  <div class="row"><div><label>Turma</label><select id="et">${opts(fT)}</select></div><div><label>Matrícula</label><input id="em"></div><div style="flex:2 1 220px"><label>Nome completo</label><input id="en"></div></div>
  <button class="btn" style="margin-top:.8rem" onclick="addEleit()">Cadastrar eleitor</button><div class="msg" id="er" role="alert"></div>
  <label>Cadastro em lote (uma linha por aluno: matrícula;nome) — usa a turma escolhida acima</label><textarea id="lote" rows="3" placeholder="20261234;Maria da Silva"></textarea>
  <button class="btn s" style="margin-top:.5rem" onclick="lote()">Importar lista</button>
  <div class="row" style="margin-top:1rem"><div><label>Filtrar tabela</label><select onchange="eT=this.value;admin()"><option value="">Todas as turmas</option>${opts(eT)}</select></div></div>
  <div class="wrap"><table class="tbl"><tr><th>Matrícula</th><th>Nome</th><th>Turma</th><th>Votou</th><th></th></tr>${l.map(([m,e])=>`<tr><td>${esc(m)}</td><td>${esc(e.nome)}</td><td>${NT[e.turma]}</td><td>${e.votou?'✓':'—'}</td><td>${e.votou?'':`<button class="btn d" onclick="delEleit('${m}')">Remover</button>`}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum eleitor cadastrado.</td></tr>'}</table></div></div>`;
}
function addEleit(){
  const m=mat($('#em').value),n=$('#en').value.trim(),er=$('#er');fT=$('#et').value;
  if(!m||!n)return er.textContent='Informe matrícula e nome.';
  if(D.eleitores[m])return er.textContent='Esta matrícula já está cadastrada.';
  D.eleitores[m]={nome:n,turma:fT};save();admin();
}
function lote(){
  fT=$('#et').value;let ok=0;
  $('#lote').value.split('\n').forEach(l=>{const [a,...b]=l.split(/[;\t]/);const m=mat(a||''),n=b.join(' ').trim();if(m&&n&&!D.eleitores[m]){D.eleitores[m]={nome:n,turma:fT};ok++;}});
  save();admin();alert(ok+' eleitor(es) importado(s).');
}
function delEleit(m){if(confirm('Remover este eleitor?')){delete D.eleitores[m];save();admin();}}
function pRes(){
  return `<div class="card"><div class="row"><button class="btn" onclick="imprimir()">Imprimir / salvar PDF</button><button class="btn s" onclick="csv()">Exportar CSV</button><button class="btn d" onclick="zerar()">Zerar votos</button></div></div>${resHTML()}`;
}
function imprimir(){
  const d=new Date().toLocaleString('pt-BR');
  $('#rel').innerHTML=`<div style="text-align:center;margin-bottom:1rem"><img src="logo.png" alt="" style="height:70px"><h2>Escola Estadual Vicente de Paula Fraga</h2><h3>Relatório da eleição de representantes de turma — 2026</h3><p>Emitido em ${d} · Situação: ${D.meta.status}</p></div>${resHTML()}<p><small>Relatório sem identificação de eleitores: o voto é secreto e apenas totais são exibidos.</small></p><div class="sig"><div>Coordenação</div><div>Direção</div></div>`;
  setTimeout(()=>print(),150);
}
function csv(){
  const L=[['Turma','Candidato','Codigo','Votos']];
  TURMAS.forEach(([t,n])=>{const r=calc(t);r.cs.forEach(c=>L.push([n,c.nome,c.c,c.n]));L.push([n,'Brancos','',r.br],[n,'Nulos','',r.nu]);});
  const b=new Blob(['\ufeff'+L.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(';')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='resultados-eleicao.csv';a.click();
}
function zerar(){
  if(!confirm('Apagar TODOS os votos e liberar os eleitores para votar de novo?'))return;
  D.votos={};Object.values(D.eleitores).forEach(e=>delete e.votou);save();admin();
}
render();
</script>
</body>
</html>
